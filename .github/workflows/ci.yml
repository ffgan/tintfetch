name: CI

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
  pull_request:

# Package jobs stay read-only. The publish job opts into contents: write.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -v '/e2e$')
          go test $pkgs

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: End to end
        run: go test -count=1 ./e2e/

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: nttld/setup-ndk@v1.6.0
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0-ci"
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build archives
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build-release.sh
      - name: Upload archives
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-host
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package-ios:
    name: package ios/arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0-ci"
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build ios/arm64
        run: bash scripts/build-release.sh ios/arm64
      - name: Upload archive
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: [test, e2e, package, package-ios, source-audit]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: downloaded
      - name: Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "GO_VERSION=$(tr -d '[:space:]' < .go-version)" >> "$GITHUB_ENV"
      - name: Collect archives
        run: |
          mkdir -p dist
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          find dist -type f | wc -l
      - name: Complete corresponding source
        run: |
          make dist VERSION="$VERSION"
          cp "build/tintfetch-$VERSION.tar.gz" "dist/tintfetch_${VERSION}_source.tar.gz"
          python3 scripts/check-release-source.py dist "$VERSION"
      - name: Check the archive set
        run: bash scripts/build-release.sh --expect-dist
      - name: Checksums
        run: |
          cd dist
          rm -f tintfetch_*_checksums.txt
          LC_ALL=C sha256sum -- tintfetch_* | tee "tintfetch_${VERSION}_checksums.txt"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*
          body: |
            用 Go ${{ env.GO_VERSION }} 构建。这是目前仍在维护的最老 Go 版本，二进制保持它的系统要求（macOS 12，Linux ppc64 的 ELFv1）。

            覆盖该版本 `go tool dist list` 的全部目标。32 位 ARM 提供 ARMv5、ARMv6、ARMv7。MIPS 同时提供 hardfloat 和 softfloat。

            `android/386`、`android/amd64`、`android/armv7` 用 Android NDK r27d（API 21）做外部链接。`ios/arm64` 用 Xcode 的 iOS SDK，最低系统版本是 iOS 12。其余目标都是 `CGO_ENABLED=0`。

            Go 1.26 已经去掉 `windows/arm`，也不再列出 `freebsd/riscv64`，所以这两个移植不在这个 release 里。

            每个二进制包包含 LICENSE、COPYING、THIRD_PARTY_NOTICES 和源码说明。完整对应源码在同一 release 的 `tintfetch_*_source.tar.gz`，二进制按 GPL-2.0-or-later 分发。SHA-256 在 `tintfetch_*_checksums.txt`。

  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify local audited files
        run: make check-provenance
      - name: Compare with pinned upstream references
        run: |
          mkdir -p build/upstream
          python3 scripts/check-provenance.py --fetch | while read -r name url; do
            curl --fail --location --retry 3 "$url" -o "build/upstream/$name" || exit 1
          done
          python3 scripts/check-provenance.py --upstream-dir build/upstream
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - run: make build && sh scripts/smoke.sh && sh scripts/reproducible.sh
      - run: sh scripts/test-release-source.sh
