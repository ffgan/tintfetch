# tintfetch config. The print_info block chooses the lines, in order.
print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Editor" editor
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "WM Theme" wm_theme
    info "Theme" theme
    info "Icons" icons
    info "Cursor" cursor
    info "Font" font
    info "Terminal" term
    info "Terminal Font" term_font
    info "CPU" cpu
    info "GPU" gpu
    info "NPU" npu
    info "GPU Driver" gpu_driver
    info "Memory" memory
    info "Swap" swap
    info "Disk" disk
    info "Battery" battery
    info "Power Adapter" power_adapter
    info "Local IP" local_ip
    info "Locale" locale
    info "Users" users
    info "Network" network
    info "Bluetooth" bluetooth
    info "BIOS" bios
    info cols
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
memory_precision="2"
package_managers="on"
package_separate="on"
package_minimal=""
shell_path="off"
shell_version="on"
editor_path="off"
editor_version="on"
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="on"
gtk_shorthand="off"
gtk2="on"
gtk3="on"
qt="on"
public_ip_host="https://ident.me"
public_ip_timeout="2"
local_ip_interface=('auto')
de_version="on"
disk_show=('/')
disk_subtitle="mount"
disk_percent="on"
music_player="auto"
song_format="%artist% - %album% - %title%"
song_shorthand="off"
mpc_args=()
colors=(distro)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"
block_range=(0 15)
color_blocks="on"
block_width="3"
block_height="1"
col_offset="auto"
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length="15"
bar_color_elapsed="distro"
bar_color_total="distro"
memory_display="off"
battery_display="off"
disk_display="off"
image_backend="ascii"
image_source="auto"
ascii_distro="auto"
ascii_colors=(distro)
ascii_bold="on"
image_loop="off"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
crop_mode="normal"
crop_offset="center"
image_size="auto"
catimg_size="2"
gap="3"
yoffset="0"
xoffset="0"
background_color=""
stdout="auto"
custom=""
command=""
weather_location=""
weather_format="%t - %C (%l)"
separator_string=""
